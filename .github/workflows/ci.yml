# Workflow de integración continua del Sistema Académico.
# Verifica que el proyecto instale, pase los tests y compile antes de mergear.
#
# Ojo con algo que confunde la primera vez: GitHub lee este archivo desde la rama involucrada.
# Para que corra en los PR hacia development, el archivo tiene que estar también en development;
# llega solo cuando el E1 mergea el primer PR que lo incluye.
name: CI

# Cuándo se ejecuta este workflow.
on:
  # Al abrir o actualizar un Pull Request que apunte a estas ramas.
  pull_request:
    branches:
      - development
      - testing
      - production
  # Al pushear a la rama de tu equipo, para que veas si compila ANTES de abrir el PR,
  # y también cuando algo ya entró (por PR mergeado) a las ramas de integración.
  # Nota: mientras tengas un PR abierto desde tu rama vas a ver dos ejecuciones, una del push
  # y otra del PR. Es normal: las dos hacen exactamente lo mismo.
  push:
    branches:
      - e1
      - e2
      - e3
      - e4
      - development
      - testing
      - production
  # Permite ejecutarlo a mano desde la pestaña Actions (le sirve al E1 antes de promover).
  workflow_dispatch:

# Permisos mínimos: el workflow solo necesita leer el código del repositorio.
permissions:
  contents: read

jobs:
  build:
    name: Compilar el proyecto (React + Vite)
    # Máquina virtual Linux provista por GitHub.
    runs-on: ubuntu-latest
    steps:
      # Descarga el código del repositorio dentro de la máquina virtual.
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Instala Node 20 y cachea los paquetes npm según el package-lock.json.
      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Instala las dependencias exactas del package-lock.json (npm ci, no npm install).
      - name: Instalar dependencias
        run: npm ci

      # Pasa ESLint solo para avisar: si encuentra algo lo marca, pero NO tumba el CI.
      # Es a propósito: un aviso de estilo no tiene que frenarle el PR a un equipo.
      # Igual, miralo y arreglalo.
      - name: Lint (informativo, no bloquea)
        run: npm run lint
        continue-on-error: true

      # Corre los tests con Vitest. El flag --passWithNoTests evita que falle mientras todavía
      # no haya archivos de test; cuando los equipos escriban los suyos, corren solos.
      - name: Tests
        run: npx vitest run --passWithNoTests

      # Compila el proyecto con Vite. Si esto falla, el PR no se mergea.
      - name: Compilar
        run: npm run build
